<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17133a" />
    <title>Scope Guard</title>
    <script>
      // Apply an explicitly saved dark preference before first paint.
      // Light is always the default; system preferences are ignored.
      // Key must match THEME_KEY in src/lib/theme-storage.ts.
      try {
        if (localStorage.getItem('scope-guard-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) { /* storage unavailable: stay light */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
